# Render Blueprint Specification for Aegis Security Cloud Deployment
# Deploy this blueprint on render.com to host the database, backend APIs, and static web dashboard.

services:
  # 1. Managed PostgreSQL Database Instance
  - type: database
    name: aegis-db
    databaseName: aegis_security_db
    user: aegis_admin
    plan: free

  # 2. Unified Backend Monolith API Web Service (FastAPI)
  - type: web
    name: aegis-backend-api
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 3. Static Web App Frontend Dashboard
  - type: web
    name: aegis-frontend-dashboard
    env: static
    plan: free
    publishPath: ./frontend-web
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
